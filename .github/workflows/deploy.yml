name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Never let two deploys race. Do not cancel in progress: a half-finished Pages
# deploy is worse than a slightly stale one.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        name: build for pages
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Build
              run: npx vite build
              env:
                  # Project sites are served from /<repo>/, so assets need the prefix.
                  VITE_BASE: /substrate/

            - uses: actions/configure-pages@v5

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        name: deploy to pages
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
